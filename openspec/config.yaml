schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
  tasks:
    - Don't create unit-test tasks unless the user asks; verification steps in tasks are still required and can include unit tests if that's easiest
    - Check README.md for any information that will be affected by the changes, otherwise only make additions if prompted or if user agrees to when prompted

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
operations:
  apply:
    guidance:
      - Don't over-comment in the codebase, keep to major function docstrings and on complex or dependency-specific logic
      - Only update README.md for any existing information that will be affected by the changes, otherwise only make additions if prompted or if user agrees to when prompted
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
